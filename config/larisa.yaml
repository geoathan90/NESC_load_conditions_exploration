region:
  name: Larisa
  north: 40.25
  south: 39.25
  west: 21.75
  east: 22.75
  grid_spacing_degrees: 0.25
  crs: EPSG:4326

era5:
  months: [12, 1, 2]
  variables: [t2m, d2m, ptype, tcslw, lcc, cbh, fg10, avg_tprate, avg_tsrwe]
  files:
    instant: data_stream-oper_stepType-instant.nc
    avg: data_stream-oper_stepType-avg.nc
    max: data_stream-oper_stepType-max.nc
  variables_by_step_type:
    instant: [t2m, d2m, ptype, tcslw, lcc, cbh]
    avg: [avg_tprate, avg_tsrwe]
    max: [fg10]

storage:
  data_root_env: NESC_DATA_ROOT
  default_data_root: data/raw
  output_root: outputs/larisa
  derived_root: derived/larisa
  drive_manifest: manifests/larisa_drive_inventory.csv

source:
  google_drive_root_url: https://drive.google.com/drive/folders/1Xaik2eRRXxF_8kQsen0byVHQ_noC_bpO

analysis:
  cold_thresholds_c: [0, -5, -10]
  precipitation_sensitivity_thresholds_mmh: [0, 0.01, 0.1]
  event_minimum_duration_hours: 1
